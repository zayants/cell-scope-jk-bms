name: Сообщить об ошибке
description: Ошибка подключения, показаний, интерфейса или web dashboard
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Не публикуйте Telegram-токен, ключи или другие секреты.
  - type: input
    id: app-version
    attributes:
      label: Версия приложения
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Телефон и версия Android
      placeholder: Xiaomi Redmi 12, Android 15
    validations:
      required: true
  - type: input
    id: bms
    attributes:
      label: Модель и firmware BMS
      placeholder: JK-B1A8S10P, firmware 15.41
  - type: input
    id: cells
    attributes:
      label: Количество ячеек
      placeholder: 8
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите ожидаемое и фактическое поведение, а также шаги воспроизведения.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты и безопасные фрагменты логов
      description: Перед публикацией удалите MAC-адреса и токены.
