name: Отчёт о совместимости
description: Результат проверки новой BMS или Android-устройства
title: "[Совместимость]: "
labels: ["compatibility"]
body:
  - type: input
    id: bms
    attributes:
      label: BMS и firmware
      placeholder: JK-B1A8S10P, firmware 15.41
    validations:
      required: true
  - type: input
    id: cells
    attributes:
      label: Количество и тип ячеек
      placeholder: 8S LiFePO4
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Устройство и Android
      placeholder: Xiaomi Redmi 12, Android 15
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Что работает корректно
      options:
        - label: BLE подключается
        - label: SOC соответствует штатному приложению
        - label: Ток соответствует штатному приложению
        - label: Напряжения ячеек корректны
        - label: Температуры корректны
        - label: Локальный web dashboard работает
  - type: textarea
    id: notes
    attributes:
      label: Замечания, отличия и скриншоты
