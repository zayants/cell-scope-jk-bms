name: Compatibility report
description: Share test results for a BMS model or Android device
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: input
    id: bms
    attributes:
      label: BMS model and firmware
      placeholder: JK-B1A8S10P, firmware 15.41
    validations:
      required: true
  - type: input
    id: cells
    attributes:
      label: Cell configuration and chemistry
      placeholder: 8S LiFePO4
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Device and Android version
      placeholder: Xiaomi Redmi 12, Android 15
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: What works correctly?
      options:
        - label: BLE connection
        - label: SOC matches the official application
        - label: Current matches the official application
        - label: Cell voltages are correct
        - label: Temperatures are correct
        - label: Local web dashboard works
  - type: textarea
    id: notes
    attributes:
      label: Notes, differences, and screenshots
